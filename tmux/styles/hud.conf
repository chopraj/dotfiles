set -g @tab_style hud
set -g window-status-separator ""
set -g status-left "#[fg=#{@thm_accent}]▌#[fg=#{@thm_text},bold]#{E:@tab_session}#[default]"
set -g window-status-format "#[fg=#{?@agent_done,#{@thm_alert},#{@thm_muted}}] #{?@agent_done,▌, }#{?client_prefix,#{E:@tab_index} ,}#W #[fg=#{@thm_rule}]#{?window_end_flag,,│}"
set -g window-status-current-format " #[fg=#{@thm_accent}]▌#[fg=#{@thm_text},bold]#{?client_prefix,#{E:@tab_index} ,}#W #[fg=#{@thm_rule},nobold]#{?window_end_flag,,│}"
