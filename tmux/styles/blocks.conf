set -g @tab_style blocks
set -g window-status-separator " "
set -g status-left "#[fg=#{@thm_bg},bg=#{@thm_light},bold] #{E:@tab_session} #[default]"
set -g window-status-format "#[fg=#{?@agent_done,#{@thm_bg},#{@thm_muted}},bg=#{?@agent_done,#{@thm_alert},#{@thm_surface}}] #{?client_prefix,#{E:@tab_index} ,}#W #[default]"
set -g window-status-current-format "#[fg=#{@thm_bg},bg=#{@thm_accent},bold] #{?client_prefix,#{E:@tab_index} ,}#W #[default]"
