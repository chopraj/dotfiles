set -g @tab_style angled
set -g window-status-separator " "
set -g status-left "#[fg=#{@thm_light},bg=default]#[fg=#{@thm_bg},bg=#{@thm_light},bold] #{E:@tab_session} #[fg=#{@thm_light},bg=default,nobold]#[default]"
set -g window-status-format "#[fg=#{?@agent_done,#{@thm_alert},#{@thm_surface}},bg=default]#[fg=#{?@agent_done,#{@thm_bg},#{@thm_muted}},bg=#{?@agent_done,#{@thm_alert},#{@thm_surface}}] #{?client_prefix,#{E:@tab_index} ,}#W #[fg=#{?@agent_done,#{@thm_alert},#{@thm_surface}},bg=default]"
set -g window-status-current-format "#[fg=#{@thm_accent},bg=default]#[fg=#{@thm_bg},bg=#{@thm_accent},bold] #{?client_prefix,#{E:@tab_index} ,}#W #[fg=#{@thm_accent},bg=default,nobold]"
