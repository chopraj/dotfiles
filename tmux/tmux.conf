unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -g set-titles-string '#S:#W'
set -a terminal-features "tmux-256color:RGB"
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-style "bg=default,fg=colour252"
set -g status-left-length 20
set -g status-left "#[fg=colour252] #S #[default]"
set -g status-right '#{?@suspend_active,#[fg=#fbbf24]#[bold] INNER #[default],}'
set -g window-status-separator "  "
set -g window-status-style "bg=default,fg=colour245"
set -g window-status-current-style "bg=default,fg=#c4b5fd,bold"
set -g window-status-activity-style "bg=default,fg=colour250"
set -g window-status-format '#{?@agent_done,#[fg=#fbbf24]#[bold],#[fg=colour245]} #I:#W #[default]'
set -g window-status-current-format " #I:#W "
set-hook -g 'after-select-window[100]' 'set-option -wu @agent_done'
set -g message-style "bg=default,fg=#c4b5fd"
set -g mode-style "bg=#c4b5fd,fg=black,bold"

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set -g @annotations-key 'a'
set -g @annotations-view-key 'a'
set -g @annotations-copy-key 'A'
run-shell ~/.tmux/tmux-annotations/annotations.tmux
bind-key -T root MouseDown1Status if-shell -F \
  '#{==:#{mouse_status_range},annotations}' \
  "run-shell -b \"'/Users/rajchopra/.tmux/tmux-annotations/scripts/view.sh'\"" \
  'switch-client -t ='

set -g @suspend_key 'F12'
set -g @suspend_suspended_options '@suspend_active::1'
run-shell ~/.tmux/tmux-suspend/suspend.tmux
