unbind r
bind r display-popup -E -w 60 -h 7 -x C -y C -b rounded -S 'fg=#c4b5fd' -T ' Rename Window ' '/bin/sh /Users/rajchopra/.config/tmux/rename-window.sh #{window_id}'

set -g history-limit 50000
set -g mouse on
set -g set-titles on
set -s set-clipboard on
set -g focus-events on
set -g set-titles-string '#S:#W'
set -a terminal-features "tmux-256color:RGB"
set -ga terminal-overrides ',xterm*:smcup@:rmcup@'
set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 5
set -g status-style "bg=default,fg=colour252"
set -g status-left-length 40

set -g @thm_bg "#0a0a0a"
set -g @thm_surface "#262626"
set -g @thm_muted "#a3a3a3"
set -g @thm_text "#fafafa"
set -g @thm_light "#bcbcbc"
set -g @thm_accent "#c4b5fd"
set -g @thm_alert "#fbbf24"
set -g @thm_rule "#404040"
set -g @tab_index "#{?#{e|<:#{window_index},10},0,}#{window_index}"
set -g @tab_session "#(echo #{q:session_name} | tr '[:lower:]' '[:upper:]')"

set -g window-status-style default
set -g window-status-current-style default
set -g window-status-activity-style default
set -g window-status-bell-style default
# Style files must not set status-right: tmux-annotations prepends its segment to it at load.
source-file /Users/rajchopra/.config/tmux/styles/angled.conf
bind-key T display-menu -T "#[align=centre]Tab style" \
  "Angled" a { source-file /Users/rajchopra/.config/tmux/styles/angled.conf; display-message "Tab style: angled" } \
  "Blocks" b { source-file /Users/rajchopra/.config/tmux/styles/blocks.conf; display-message "Tab style: blocks" } \
  "HUD" h { source-file /Users/rajchopra/.config/tmux/styles/hud.conf; display-message "Tab style: hud" } \
  "Brackets" r { source-file /Users/rajchopra/.config/tmux/styles/brackets.conf; display-message "Tab style: brackets" }

set -g status-right '#{?SSH_CONNECTION,#[fg=colour245]#{user}@#{host_short} #[default],}#{?@suspend_active,#[fg=#fbbf24#,bold]INNER #[default],}'
set-hook -g 'after-select-window[100]' 'set-option -wu @agent_done'
set -g message-style "bg=default,fg=#c4b5fd"
set -g mode-style "bg=#c4b5fd,fg=black,bold"
set -g menu-selected-style "bg=#c4b5fd,fg=black,bold"
set -g menu-border-style "fg=#404040"
set -g pane-border-indicators both
set -g pane-active-border-style "fg=#c4b5fd"
set -g pane-border-status off

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key q display-popup -w 100% -h 100% -E '/Users/rajchopra/.cargo/bin/tmux-expose'

set -g @fzf_pane_switch_bind-key 'e'
set -g @fzf_pane_switch_refresh 'true'
run-shell ~/.tmux/fzf-pane-switch.tmux/select_pane.tmux

set -g @annotations-key 'a'
set -g @annotations-view-key 'a'
set -g @annotations-copy-key 'A'
run-shell ~/.tmux/tmux-annotations/annotations.tmux
bind-key -T root MouseDown1Status if-shell -F \
  '#{==:#{mouse_status_range},annotations}' \
  "run-shell -b \"'/Users/rajchopra/.tmux/tmux-annotations/scripts/view.sh'\"" \
  'switch-client -t ='

set -g @suspend_key 'F12'
set -g @suspend_suspended_options '@suspend_active::1'
run-shell ~/.tmux/tmux-suspend/suspend.tmux
